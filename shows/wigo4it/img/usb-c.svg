<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-labelledby="title desc">
  <title id="title">USB-C kabel</title>
  <desc id="desc">Een USB-C stekker die op het punt staat in een poort te klikken: één standaard aansluiting die overal past.</desc>

  <!-- Kleuren: Rijkshuisstijl community design tokens
       lintblauw-700 #162945, lintblauw-500 #154273, lintblauw-400 #4F7196
       hemelblauw-500 #007BC7, hemelblauw-400 #409CD5
       donkerblauw-500 #01689B, donkerblauw-600 #01496C
       lichtblauw-500 #8FCAE7, mintgroen-500 #76D2B6, donkergeel-500 #FFB612
       cool-grey-50 #F8FAFC, cool-grey-300 #CBD5E1, cool-grey-400 #94A3B8,
       cool-grey-500 #64748B, cool-grey-600 #475569, cool-grey-700 #334155, cool-grey-900 #0F172A -->

  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#4F7196" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <!-- Cilindrische glans op het metaal -->
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="0.18" stop-color="#CBD5E1"/>
      <stop offset="0.38" stop-color="#F8FAFC"/>
      <stop offset="0.62" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="metal-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="housing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#01496C"/>
      <stop offset="0.3" stop-color="#007BC7"/>
      <stop offset="0.55" stop-color="#01689B"/>
      <stop offset="1" stop-color="#01496C"/>
    </linearGradient>
    <linearGradient id="relief" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#01496C"/>
      <stop offset="0.4" stop-color="#01689B"/>
      <stop offset="1" stop-color="#01496C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#76D2B6" stop-opacity="0.5"/>
    </radialGradient>
    <clipPath id="panel">
      <rect width="400" height="560" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#panel)">
    <!-- Achtergrond -->
    <rect width="400" height="560" fill="#162945"/>
    <rect width="400" height="560" fill="url(#grid)"/>

    <!-- Apparaat met poort -->
    <rect x="50" y="-20" width="300" height="160" rx="18" fill="#154273" stroke="#4F7196" stroke-width="2"/>
    <circle cx="80" cy="30" r="5" fill="#76D2B6"/>
    <text x="94" y="35" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="14" fill="#8FCAE7">PORT 01</text>
    <text x="320" y="35" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="14" fill="#94A3B8">200 OK</text>

    <!-- Poort (receptacle): bezel, holte en tong met contacten -->
    <ellipse cx="200" cy="96" rx="100" ry="42" fill="url(#glow)"/>
    <rect x="152" y="80" width="96" height="32" rx="16" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/>
    <rect x="157" y="85" width="86" height="22" rx="11" fill="none" stroke="#475569" stroke-width="1.5"/>
    <rect x="170" y="92" width="60" height="8" rx="4" fill="#334155"/>
    <g fill="#FFB612">
      <rect x="175" y="94" width="3" height="4" rx="1"/>
      <rect x="182" y="94" width="3" height="4" rx="1"/>
      <rect x="189" y="94" width="3" height="4" rx="1"/>
      <rect x="196" y="94" width="3" height="4" rx="1"/>
      <rect x="203" y="94" width="3" height="4" rx="1"/>
      <rect x="210" y="94" width="3" height="4" rx="1"/>
      <rect x="217" y="94" width="3" height="4" rx="1"/>
    </g>

    <!-- Uitlijning stekker naar poort -->
    <g stroke="#76D2B6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M158 148V164M242 148V164" stroke-dasharray="3 5"/>
      <path d="M190 160l10-8 10 8"/>
    </g>

    <!-- Kabel -->
    <path d="M200 372C200 430 96 412 96 470C96 524 300 508 300 590" fill="none" stroke="#01496C" stroke-width="24" stroke-linecap="round"/>
    <path d="M200 372C200 430 96 412 96 470C96 524 300 508 300 590" fill="none" stroke="#01689B" stroke-width="16" stroke-linecap="round"/>
    <path d="M200 372C200 430 96 412 96 470C96 524 300 508 300 590" fill="none" stroke="#8FCAE7" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 18"/>

    <!-- Trekontlasting: taps toelopend, gesegmenteerd -->
    <path d="M174 326H226L214 380H186Z" fill="url(#relief)"/>
    <g stroke="#01496C" stroke-width="2.5">
      <path d="M176 338H224M179 350H221M182 362H218M184 372H216"/>
    </g>

    <!-- Behuizing (overmold) met schouders -->
    <path d="M168 226H232Q258 226 258 252V308Q258 334 232 334H168Q142 334 142 308V252Q142 226 168 226Z" fill="url(#housing)"/>
    <path d="M168 226H232Q258 226 258 252V258H142V252Q142 226 168 226Z" fill="#409CD5" opacity="0.25"/>
    <rect x="152" y="240" width="6" height="80" rx="3" fill="#8FCAE7" opacity="0.45"/>
    <text x="200" y="278" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing="1">USB-C</text>
    <g stroke="#01496C" stroke-width="3" stroke-linecap="round">
      <path d="M176 298H224M176 308H224M176 318H224"/>
    </g>

    <!-- Metalen huls -->
    <path d="M158 178H242V230H158Z" fill="url(#metal)"/>
    <path d="M158 222H242" stroke="#64748B" stroke-width="1.5"/>
    <path d="M158 212H242" stroke="#94A3B8" stroke-width="1" opacity="0.6"/>
    <!-- Opening van de huls (in perspectief) -->
    <rect x="158" y="168" width="84" height="20" rx="10" fill="url(#metal-rim)" stroke="#64748B" stroke-width="1"/>
    <rect x="163" y="172" width="74" height="12" rx="6" fill="#0F172A"/>
    <g fill="#FFB612" opacity="0.85">
      <rect x="172" y="173" width="2.5" height="2.5" rx="0.5"/>
      <rect x="179" y="173" width="2.5" height="2.5" rx="0.5"/>
      <rect x="186" y="173" width="2.5" height="2.5" rx="0.5"/>
      <rect x="193" y="173" width="2.5" height="2.5" rx="0.5"/>
      <rect x="200" y="173" width="2.5" height="2.5" rx="0.5"/>
      <rect x="207" y="173" width="2.5" height="2.5" rx="0.5"/>
      <rect x="214" y="173" width="2.5" height="2.5" rx="0.5"/>
      <rect x="221" y="173" width="2.5" height="2.5" rx="0.5"/>
    </g>
  </g>
</svg>
